<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>

  <style>
    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
    }

    .box {
      background: #171722;
      padding: 25px;
      border-radius: 18px;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #0d0d15;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    select, button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    select {
      background: #0d0d15;
      color: white;
      border: 1px solid #333;
    }

    button {
      background: #6c5ce7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 20px;
      text-align: center;
    }

    video {
      width: 100%;
      margin-top: 25px;
      border-radius: 12px;
      display: none;
    }

    #download {
      display: none;
      margin-top: 15px;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AI Video Generator</h1>

  <div class="box">

    <textarea
      id="prompt"
      placeholder="Describe your video...">
    </textarea>

    <select id="model">
      <option value="google/veo-3.1-fast">
        Veo 3.1 Fast
      </option>

      <option value="google/veo-3.1">
        Veo 3.1
      </option>

      <option value="bytedance/seedance-2.0">
        Seedance 2.0
      </option>
    </select>

    <button id="generateBtn" onclick="generateVideo()">
      Generate Video
    </button>

    <div id="status"></div>

    <video id="video" controls></video>

    <a id="download" target="_blank">
      Open / Download Video
    </a>

  </div>

</div>

<script>

async function generateVideo() {

  const prompt = document.getElementById("prompt").value.trim();
  const model = document.getElementById("model").value;
  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const download = document.getElementById("download");

  if (!prompt) {
    status.textContent = "Please enter a video prompt.";
    return;
  }

  button.disabled = true;
  video.style.display = "none";
  download.style.display = "none";

  status.textContent = "Starting video generation...";

  try {

    const response = await fetch("/api/generate", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt,
        model: model
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Generation failed");
    }

    status.textContent = "Video is generating...";

    checkStatus(data.polling_url);

  } catch (error) {

    status.textContent = "Error: " + error.message;
    button.disabled = false;

  }
}


async function checkStatus(pollingUrl) {

  const status = document.getElementById("status");
  const button = document.getElementById("generateBtn");
  const video = document.getElementById("video");
  const download = document.getElementById("download");

  try {

    const response = await fetch("/api/status", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        polling_url: pollingUrl
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Status check failed");
    }

    if (data.status === "completed") {

      const videoUrl = data.video_url;

      status.textContent = "Video ready!";

      video.src = videoUrl;
      video.style.display = "block";

      download.href = videoUrl;
      download.textContent = "Open / Download Video";
      download.style.display = "block";

      button.disabled = false;

      return;
    }

    if (data.status === "failed") {

      status.textContent =
        "Video generation failed: " +
        (data.error || "Unknown error");

      button.disabled = false;

      return;
    }

    status.textContent =
      "Generating... Status: " + data.status;

    setTimeout(() => {
      checkStatus(pollingUrl);
    }, 5000);

  } catch (error) {

    status.textContent = "Error: " + error.message;
    button.disabled = false;

  }
}

</script>

</body>
</html>
